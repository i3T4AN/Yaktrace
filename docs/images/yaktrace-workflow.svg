<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">YakTrace workflow</title>
  <desc id="desc">A four-stage YakTrace workflow: lock a UTC window, build a capture chain, organize author groups, and create a local PDF dossier.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#071421"/>
      <stop offset="1" stop-color="#0d2432"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" x2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#020617" flood-opacity=".42"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#527080" stroke-opacity=".15" stroke-width="1"/>
    </pattern>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9cc7d9"/>
    </marker>
  </defs>

  <rect width="1600" height="760" fill="url(#background)"/>
  <rect width="1600" height="760" fill="url(#grid)"/>
  <path d="M 120 143 H 1480" stroke="#426175" stroke-opacity=".7" stroke-width="2"/>
  <circle cx="120" cy="143" r="6" fill="#22d3ee"/>
  <circle cx="1480" cy="143" r="6" fill="#22d3ee"/>

  <text x="800" y="108" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="51" font-weight="700" text-anchor="middle" letter-spacing=".5">YakTrace workflow</text>
  <text x="800" y="185" fill="#9cc7d9" font-family="Arial, Helvetica, sans-serif" font-size="19" text-anchor="middle" letter-spacing="3">FIXED-WINDOW COLLECTION • LOCAL EVIDENCE • AUDITABLE OUTPUT</text>

  <g fill="none" stroke="#9cc7d9" stroke-width="3" marker-end="url(#arrowhead)">
    <path d="M 379 436 H 453"/>
    <path d="M 758 436 H 832"/>
    <path d="M 1137 436 H 1211"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="72" y="250" width="307" height="350" rx="22" fill="#0b1d2a" stroke="url(#cyan)" stroke-width="3"/>
    <rect x="451" y="250" width="307" height="350" rx="22" fill="#0b1d2a" stroke="url(#cyan)" stroke-width="3"/>
    <rect x="830" y="250" width="307" height="350" rx="22" fill="#0b1d2a" stroke="url(#cyan)" stroke-width="3"/>
    <rect x="1209" y="250" width="307" height="350" rx="22" fill="#0b1d2a" stroke="url(#amber)" stroke-width="3"/>
  </g>

  <!-- calendar -->
  <g transform="translate(157 299)" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="28" width="137" height="115" rx="15"/>
    <path d="M 0 67 H 137 M 36 0 V 49 M 101 0 V 49"/>
    <path d="M 30 94 H 45 M 62 94 H 77 M 94 94 H 109 M 30 119 H 45 M 62 119 H 77"/>
    <rect x="91" y="109" width="23" height="21" rx="4" fill="#fbbf24" stroke="#fbbf24"/>
  </g>
  <text x="225" y="505" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="middle" letter-spacing="1.3">LOCKED UTC WINDOW</text>
  <text x="225" y="543" fill="#9cc7d9" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle">1–15 weeks</text>

  <!-- snapshot cards -->
  <g transform="translate(532 296)" fill="#102d40" stroke="#75bdd9" stroke-width="4">
    <rect x="0" y="0" width="132" height="104" rx="12" opacity=".42"/>
    <rect x="22" y="23" width="132" height="104" rx="12" opacity=".68"/>
    <rect x="44" y="46" width="132" height="104" rx="12"/>
    <path d="M 63 86 H 157 M 63 110 H 136 M 63 129 H 148" stroke="#b5d9e8" stroke-width="7" stroke-linecap="round"/>
    <circle cx="151" cy="74" r="9" fill="#22d3ee" stroke="none"/>
  </g>
  <text x="604" y="505" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="middle" letter-spacing="1.3">CAPTURE CHAIN</text>
  <text x="604" y="543" fill="#9cc7d9" font-family="Arial, Helvetica, sans-serif" font-size="21" text-anchor="middle">same window each time</text>

  <!-- grouped account cards -->
  <g transform="translate(901 293)">
    <g fill="#102d40" stroke="#75bdd9" stroke-width="4">
      <rect x="22" y="0" width="138" height="101" rx="12" opacity=".55"/>
      <rect x="44" y="31" width="138" height="101" rx="12" opacity=".78"/>
      <rect x="0" y="65" width="138" height="101" rx="12"/>
    </g>
    <g fill="none" stroke="#b5d9e8" stroke-width="7" stroke-linecap="round">
      <circle cx="37" cy="101" r="13" stroke="#22d3ee"/>
      <path d="M 66 96 H 113 M 66 118 H 101 M 22 140 H 116"/>
      <circle cx="81" cy="64" r="13" stroke="#5eead4"/>
      <circle cx="59" cy="34" r="13" stroke="#fbbf24"/>
    </g>
  </g>
  <text x="983" y="505" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="middle" letter-spacing="1.3">AUTHOR GROUPS</text>
  <text x="983" y="543" fill="#9cc7d9" font-family="Arial, Helvetica, sans-serif" font-size="21" text-anchor="middle">posts organized by account</text>

  <!-- dossier -->
  <g transform="translate(1301 291)" fill="none" stroke-linejoin="round">
    <path d="M 22 0 H 127 L 174 47 V 162 H 22 Z" fill="#132b35" stroke="url(#amber)" stroke-width="5"/>
    <path d="M 127 0 V 47 H 174" fill="#fbbf24" stroke="url(#amber)" stroke-width="5"/>
    <path d="M 51 83 H 142 M 51 107 H 132 M 51 131 H 112" stroke="#c8dae5" stroke-width="7" stroke-linecap="round"/>
  </g>
  <text x="1363" y="505" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="middle" letter-spacing="1.3">LOCAL PDF DOSSIER</text>
  <text x="1363" y="543" fill="#f7c85c" font-family="Arial, Helvetica, sans-serif" font-size="21" text-anchor="middle">auditable report</text>

  <text x="800" y="682" fill="#6f96a9" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle">The selected historical window stays fixed for the entire run.</text>
</svg>
